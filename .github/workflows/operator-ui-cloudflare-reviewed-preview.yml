name: operator-ui-cloudflare-reviewed-preview

on:
  pull_request:
    branches:
      - nli/wo-003-operator-interface-foundation
    paths:
      - .github/workflows/operator-ui-cloudflare-reviewed-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-ui-cloudflare-reviewed-preview
  cancel-in-progress: true

jobs:
  reviewed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create isolated bearer-session configuration
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_FIXTURE_PASSWORD="Bootstrap!$(openssl rand -hex 18)9"
          ADMIN_PASSWORD="Admin!$(openssl rand -hex 18)9"
          EDITOR_PASSWORD="Editor!$(openssl rand -hex 18)9"
          VIEWER_PASSWORD="Viewer!$(openssl rand -hex 18)9"
          AGENCY_VIEWER_PASSWORD="Agency!$(openssl rand -hex 18)9"
          POSTGRES_PASSWORD="preview-db-${GITHUB_RUN_ID}"
          JWT_SECRET="$(openssl rand -hex 32)"
          SESSION_SECRET="$(openssl rand -hex 32)"
          S3_ACCESS_KEY="preview${GITHUB_RUN_ID}"
          S3_SECRET_KEY="$(openssl rand -hex 24)"

          echo "::add-mask::${BOOTSTRAP_FIXTURE_PASSWORD}"
          echo "::add-mask::${ADMIN_PASSWORD}"
          echo "::add-mask::${EDITOR_PASSWORD}"
          echo "::add-mask::${VIEWER_PASSWORD}"
          echo "::add-mask::${AGENCY_VIEWER_PASSWORD}"
          echo "::add-mask::${POSTGRES_PASSWORD}"
          echo "::add-mask::${JWT_SECRET}"
          echo "::add-mask::${SESSION_SECRET}"
          echo "::add-mask::${S3_SECRET_KEY}"

          {
            echo "BOOTSTRAP_FIXTURE_PASSWORD=${BOOTSTRAP_FIXTURE_PASSWORD}"
            echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}"
            echo "EDITOR_PASSWORD=${EDITOR_PASSWORD}"
            echo "VIEWER_PASSWORD=${VIEWER_PASSWORD}"
            echo "AGENCY_VIEWER_PASSWORD=${AGENCY_VIEWER_PASSWORD}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
          } >> "${GITHUB_ENV}"

          cat > .env <<EOF
          APP_ENV=development
          NEXT_PUBLIC_DEPLOYMENT_LABEL=VISUAL REDESIGN REVIEW / NOT OFFICIAL PRODUCTION
          PROJECT_NAME=eg-addressing
          COMPOSE_PROJECT_NAME=eg_addressing_verified_preview_${GITHUB_RUN_ID}
          TZ=Africa/Malabo
          LOG_LEVEL=INFO

          ADMIN_PORT=3100
          API_PORT=8100
          POSTGRES_PORT=5434
          REDIS_PORT=6384
          MINIO_PORT=9100
          MINIO_CONSOLE_PORT=9101

          POSTGRES_DB=addressing
          POSTGRES_USER=addressing
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=postgresql+psycopg://addressing:${POSTGRES_PASSWORD}@postgres:5432/addressing
          REDIS_URL=redis://redis:6379/0

          S3_ENDPOINT=http://minio:9000
          S3_REGION=eu-west-1
          S3_BUCKET=addressing-verified-review
          S3_ACCESS_KEY=${S3_ACCESS_KEY}
          S3_SECRET_KEY=${S3_SECRET_KEY}

          JWT_SECRET=${JWT_SECRET}
          SESSION_SECRET=${SESSION_SECRET}
          SESSION_TTL_HOURS=6
          SESSION_COOKIE_MODE=bearer-local-storage
          SESSION_COOKIE_SECURE=false
          ALLOW_DEFAULT_DEMO_PASSWORDS=false
          PUBLICATION_RELEASE_ENABLED=false
          NEXT_PUBLIC_PUBLICATION_RELEASE_ENABLED=false

          ADMIN_BASE_URL=http://127.0.0.1:3100
          API_BASE_URL=http://127.0.0.1:8100/api
          NEXT_PUBLIC_API_BASE_URL=
          INTERNAL_API_BASE_URL=http://api:8100

          PUBLIC_RATE_LIMIT_ENABLED=true
          PUBLIC_RATE_LIMIT_MAX_REQUESTS=240
          PUBLIC_RATE_LIMIT_WINDOW_SECONDS=60
          EOF

      - name: Install migration dependencies
        run: python -m pip install --disable-pip-version-check -r services/api/requirements.txt

      - name: Start isolated infrastructure
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env -f infra/docker/docker-compose.yml up -d --wait --wait-timeout 180 postgres redis minio
          consecutive_ready_checks=0
          for attempt in $(seq 1 60); do
            if docker compose --env-file .env -f infra/docker/docker-compose.yml exec -T postgres \
              psql -U addressing -d addressing -v ON_ERROR_STOP=1 -tAc 'SELECT 1' \
              | grep -qx '1'; then
              consecutive_ready_checks=$((consecutive_ready_checks + 1))
              if [ "${consecutive_ready_checks}" -ge 3 ]; then
                echo 'PostgreSQL accepted three consecutive SQL readiness probes.'
                exit 0
              fi
            else
              consecutive_ready_checks=0
            fi
            sleep 2
          done
          docker compose --env-file .env -f infra/docker/docker-compose.yml ps
          exit 1

      - name: Apply migrations and load temporary staff data
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="postgresql+psycopg://addressing:${POSTGRES_PASSWORD}@127.0.0.1:5434/addressing"
          python infra/scripts/migrate.py apply
          python infra/scripts/load_reference_data.py load
          APP_ENV=development \
          EG_ALLOW_DEV_FIXTURES=YES \
          DEVELOPMENT_FIXTURE_PASSWORD="${BOOTSTRAP_FIXTURE_PASSWORD}" \
          python infra/scripts/load_development_fixtures.py load

          python - <<'PY'
          import os
          import sys

          import psycopg

          sys.path.insert(0, 'services/api')
          from app.db import _hash_password

          credentials = {
              'admin': ('admin', os.environ['ADMIN_PASSWORD']),
              'editor': ('editor', os.environ['EDITOR_PASSWORD']),
              'viewer': ('viewer', os.environ['VIEWER_PASSWORD']),
              'agency_viewer': ('agency_viewer', os.environ['AGENCY_VIEWER_PASSWORD']),
          }
          database_url = os.environ['DATABASE_URL'].replace('postgresql+psycopg://', 'postgresql://', 1)
          with psycopg.connect(database_url) as connection:
              with connection.cursor() as cursor:
                  for username, (expected_role, password) in credentials.items():
                      cursor.execute(
                          '''
                          UPDATE users
                          SET password_hash = %s, is_active = TRUE
                          WHERE username = %s AND role = %s
                          RETURNING username, role
                          ''',
                          (_hash_password(password), username, expected_role),
                      )
                      row = cursor.fetchone()
                      if row != (username, expected_role):
                          raise SystemExit(f'credential rotation failed for {username}')
                  cursor.execute('DELETE FROM auth_tokens')
              connection.commit()
          print('temporary role credentials rotated independently; existing sessions revoked')
          PY

      - name: Build and start redesigned application stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env -f infra/docker/docker-compose.yml up -d --build api admin
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:8100/api/v1/health >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:3100/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env -f infra/docker/docker-compose.yml ps
          docker compose --env-file .env -f infra/docker/docker-compose.yml logs --tail=200 api admin
          exit 1

      - name: Verify every temporary role locally
        shell: bash
        run: |
          set -euo pipefail
          role_password() {
            case "$1" in
              admin) printf '%s' "${ADMIN_PASSWORD}" ;;
              editor) printf '%s' "${EDITOR_PASSWORD}" ;;
              viewer) printf '%s' "${VIEWER_PASSWORD}" ;;
              agency_viewer) printf '%s' "${AGENCY_VIEWER_PASSWORD}" ;;
              *) return 1 ;;
            esac
          }

          reject_password() {
            local username="$1"
            local password="$2"
            python - "${username}" "${password}" <<'PY' > /tmp/rejected-login-payload.json
          import json
          import sys
          print(json.dumps({'username': sys.argv[1], 'password': sys.argv[2]}))
          PY
            local status
            status="$(curl --silent --show-error --output /tmp/rejected-login.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --request POST \
              --data @/tmp/rejected-login-payload.json \
              http://127.0.0.1:3100/api/v1/auth/login)"
            test "${status}" = '401'
          }

          for username in admin editor viewer agency_viewer; do
            password="$(role_password "${username}")"
            python - "${username}" "${password}" <<'PY' > /tmp/login-payload.json
          import json
          import sys
          print(json.dumps({'username': sys.argv[1], 'password': sys.argv[2]}))
          PY
            curl --fail --silent --show-error \
              --header 'Content-Type: application/json' \
              --request POST \
              --data @/tmp/login-payload.json \
              http://127.0.0.1:3100/api/v1/auth/login > "/tmp/${username}-login.json"
            python - "${username}" <<'PY'
          import json
          import sys
          from pathlib import Path
          username = sys.argv[1]
          payload = json.loads(Path(f'/tmp/{username}-login.json').read_text())
          expected = 'agency_viewer' if username == 'agency_viewer' else username
          assert payload.get('user', {}).get('role') == expected, payload
          assert payload.get('token'), payload
          assert payload.get('auth_mode') == 'bearer_token', payload
          print(f'{username} local bearer login verified')
          PY
          done

          rejected_shared_password="EGVisual-${GITHUB_RUN_ID}-Review!"
          reject_password admin "${rejected_shared_password}"
          reject_password editor "${rejected_shared_password}"
          reject_password viewer "${rejected_shared_password}"
          reject_password agency_viewer "${rejected_shared_password}"
          reject_password admin 'admin123'
          reject_password editor 'editor123'
          reject_password viewer 'viewer123'
          reject_password agency_viewer 'agency123'
          echo 'local rejection of former shared pattern and known defaults verified'

      - name: Start redundant Cloudflare HTTPS tunnels
        id: tunnels
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output /tmp/cloudflared
          chmod +x /tmp/cloudflared

          nohup /tmp/cloudflared tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:3100 \
            > /tmp/cloudflared-primary.log 2>&1 &
          echo $! > /tmp/cloudflared-primary.pid

          nohup /tmp/cloudflared tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:3100 \
            > /tmp/cloudflared-backup.log 2>&1 &
          echo $! > /tmp/cloudflared-backup.pid

          find_tunnel() {
            local log_file="$1"
            local url=''
            for attempt in $(seq 1 150); do
              url="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' "${log_file}" | tail -1 || true)"
              if [ -n "${url}" ] && curl --fail --silent --show-error "${url}/login" >/dev/null 2>&1; then
                printf '%s' "${url}"
                return 0
              fi
              sleep 2
            done
            cat "${log_file}" || true
            return 1
          }

          PRIMARY_URL="$(find_tunnel /tmp/cloudflared-primary.log)"
          BACKUP_URL="$(find_tunnel /tmp/cloudflared-backup.log)"

          if [ -z "${PRIMARY_URL}" ] || [ -z "${BACKUP_URL}" ] || [ "${PRIMARY_URL}" = "${BACKUP_URL}" ]; then
            echo 'Unable to establish two distinct externally reachable review domains.' >&2
            exit 1
          fi

          echo "PRIMARY_URL=${PRIMARY_URL}" >> "${GITHUB_ENV}"
          echo "BACKUP_URL=${BACKUP_URL}" >> "${GITHUB_ENV}"
          echo "primary_url=${PRIMARY_URL}" >> "${GITHUB_OUTPUT}"
          echo "backup_url=${BACKUP_URL}" >> "${GITHUB_OUTPUT}"

      - name: Verify every role through both public domains
        shell: bash
        run: |
          set -euo pipefail
          role_password() {
            case "$1" in
              admin) printf '%s' "${ADMIN_PASSWORD}" ;;
              editor) printf '%s' "${EDITOR_PASSWORD}" ;;
              viewer) printf '%s' "${VIEWER_PASSWORD}" ;;
              agency_viewer) printf '%s' "${AGENCY_VIEWER_PASSWORD}" ;;
              *) return 1 ;;
            esac
          }

          verify_role() {
            local base_url="$1"
            local label="$2"
            local username="$3"
            local password
            password="$(role_password "${username}")"
            python - "${username}" "${password}" <<'PY' > /tmp/public-login-payload.json
          import json
          import sys
          print(json.dumps({'username': sys.argv[1], 'password': sys.argv[2]}))
          PY
            curl --fail --silent --show-error \
              --header 'Content-Type: application/json' \
              --request POST \
              --data @/tmp/public-login-payload.json \
              "${base_url}/api/v1/auth/login" > "/tmp/${label}-${username}-login.json"
            TOKEN="$(python - "${label}" "${username}" <<'PY'
          import json
          import sys
          from pathlib import Path
          label, username = sys.argv[1], sys.argv[2]
          payload = json.loads(Path(f'/tmp/{label}-{username}-login.json').read_text())
          expected = 'agency_viewer' if username == 'agency_viewer' else username
          assert payload.get('user', {}).get('role') == expected, payload
          assert payload.get('auth_mode') == 'bearer_token', payload
          print(payload['token'])
          PY
          )"
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${TOKEN}" \
              "${base_url}/api/v1/auth/me" > "/tmp/${label}-${username}-me.json"
            python - "${label}" "${username}" <<'PY'
          import json
          import sys
          from pathlib import Path
          label, username = sys.argv[1], sys.argv[2]
          payload = json.loads(Path(f'/tmp/{label}-{username}-me.json').read_text())
          expected = 'agency_viewer' if username == 'agency_viewer' else username
          assert payload.get('user', {}).get('role') == expected, payload
          print(f'{label} {username} external login and protected session verified')
          PY
          }

          verify_rejected_password() {
            local base_url="$1"
            local label="$2"
            local username="$3"
            local password="$4"
            python - "${username}" "${password}" <<'PY' > /tmp/public-rejected-login-payload.json
          import json
          import sys
          print(json.dumps({'username': sys.argv[1], 'password': sys.argv[2]}))
          PY
            local status
            status="$(curl --silent --show-error --output "/tmp/${label}-${username}-rejected-login.json" --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --request POST \
              --data @/tmp/public-rejected-login-payload.json \
              "${base_url}/api/v1/auth/login")"
            test "${status}" = '401'
          }

          for username in admin editor viewer agency_viewer; do
            verify_role "${PRIMARY_URL}" primary "${username}"
            verify_role "${BACKUP_URL}" backup "${username}"
          done

          rejected_shared_password="EGVisual-${GITHUB_RUN_ID}-Review!"
          for base_and_label in "${PRIMARY_URL}|primary" "${BACKUP_URL}|backup"; do
            base_url="${base_and_label%%|*}"
            label="${base_and_label##*|}"
            verify_rejected_password "${base_url}" "${label}" admin "${rejected_shared_password}"
            verify_rejected_password "${base_url}" "${label}" editor "${rejected_shared_password}"
            verify_rejected_password "${base_url}" "${label}" viewer "${rejected_shared_password}"
            verify_rejected_password "${base_url}" "${label}" agency_viewer "${rejected_shared_password}"
            verify_rejected_password "${base_url}" "${label}" admin 'admin123'
            verify_rejected_password "${base_url}" "${label}" editor 'editor123'
            verify_rejected_password "${base_url}" "${label}" viewer 'viewer123'
            verify_rejected_password "${base_url}" "${label}" agency_viewer 'agency123'
          done
          echo 'external rejection of former shared pattern and known defaults verified on both domains'

          mkdir -p artifacts/operator-visual-review
          cat > artifacts/operator-visual-review/access.txt <<EOF
          EG ADDRESSING OPERATOR VISUAL REDESIGN REVIEW
          Exact source head: ${GITHUB_SHA}
          Preview run: ${GITHUB_RUN_ID}
          Every temporary role was authenticated and its protected session verified through both public HTTPS domains.
          Expected availability: approximately five hours after publication.

          PRIMARY LOGIN: ${PRIMARY_URL}/login
          BACKUP LOGIN: ${BACKUP_URL}/login
          PRIMARY HOME: ${PRIMARY_URL}/
          BACKUP HOME: ${BACKUP_URL}/

          Temporary accounts — independently rotated credentials:
          admin: ${ADMIN_PASSWORD}
          editor: ${EDITOR_PASSWORD}
          viewer: ${VIEWER_PASSWORD}
          agency_viewer: ${AGENCY_VIEWER_PASSWORD}

          The former shared-password pattern and known default passwords were rejected locally and through both public domains.

          Primary staff routes:
          ${PRIMARY_URL}/field
          ${PRIMARY_URL}/registry
          ${PRIMARY_URL}/verify
          ${PRIMARY_URL}/signage
          ${PRIMARY_URL}/reports
          ${PRIMARY_URL}/admin/staff

          Backup routes use the same paths on:
          ${BACKUP_URL}

          Review boundary: isolated development fixtures only. Publication is disabled. No production data is present.
          EOF

      - name: Upload externally verified access details
        uses: actions/upload-artifact@v4
        with:
          name: operator-ui-cloudflare-reviewed-access-${{ github.run_id }}
          path: artifacts/operator-visual-review/access.txt
          retention-days: 2
          if-no-files-found: error

      - name: Keep reviewed preview available
        shell: bash
        run: |
          set -euo pipefail
          for heartbeat in $(seq 1 60); do
            primary_status=0
            backup_status=0
            curl --fail --silent --show-error "${PRIMARY_URL}/login" >/dev/null || primary_status=$?
            curl --fail --silent --show-error "${BACKUP_URL}/login" >/dev/null || backup_status=$?
            if [ "${primary_status}" -ne 0 ] && [ "${backup_status}" -ne 0 ]; then
              echo "Both reviewed preview domains are unavailable at heartbeat ${heartbeat}." >&2
              exit 1
            fi
            echo "Reviewed preview heartbeat ${heartbeat}/60: primary=${primary_status}, backup=${backup_status}"
            sleep 300
          done

      - name: Capture diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/operator-visual-review
          docker compose --env-file .env -f infra/docker/docker-compose.yml ps \
            > artifacts/operator-visual-review/docker-compose-ps.txt 2>&1 || true
          docker compose --env-file .env -f infra/docker/docker-compose.yml logs --no-color --tail=300 api admin \
            > artifacts/operator-visual-review/application-logs.txt 2>&1 || true
          cp /tmp/cloudflared-primary.log artifacts/operator-visual-review/cloudflared-primary.log 2>/dev/null || true
          cp /tmp/cloudflared-backup.log artifacts/operator-visual-review/cloudflared-backup.log 2>/dev/null || true

      - name: Stop isolated review environment
        if: always()
        shell: bash
        run: |
          for pid_file in /tmp/cloudflared-primary.pid /tmp/cloudflared-backup.pid; do
            if [ -f "${pid_file}" ]; then
              kill "$(cat "${pid_file}")" 2>/dev/null || true
            fi
          done
          docker compose --env-file .env -f infra/docker/docker-compose.yml down --remove-orphans || true
