name: api-ci

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'infra/docker/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'infra/docker/**'
      - '.github/workflows/api-ci.yml'

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
