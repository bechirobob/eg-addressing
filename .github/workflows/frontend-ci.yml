name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin-portal/**'
      - 'services/api/**'
      - 'infra/docker/**'
      - 'docs/sda/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/admin-portal/**'
      - 'services/api/**'
      - 'infra/docker/**'
      - 'docs/sda/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin-portal/package-lock.json

      - name: Setup Python for API contract generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install API dependencies for OpenAPI generation
        run: |
          python -m venv services/api/.venv
          services/api/.venv/bin/python -m pip install -r services/api/requirements.txt
        working-directory: .

      - name: Verify generated API types are current
        run: |
          npm run generate:api-types
          git diff --exit-code components/apiTypes.ts

      - name: Run frontend CI checks
        run: npm run test:ci
