name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin-portal/**'
      - 'infra/docker/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/admin-portal/**'
      - 'infra/docker/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend CI checks
        run: npm run test:ci
