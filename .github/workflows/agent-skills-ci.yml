name: agent-skills-ci

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/agent-skills/**"
      - ".github/workflows/agent-skills-ci.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "docs/agent-skills/**"
      - ".github/workflows/agent-skills-ci.yml"

permissions:
  contents: read

jobs:
  validate-agent-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all 30 skills and whole-project coverage
        run: python docs/agent-skills/validate_skills.py
