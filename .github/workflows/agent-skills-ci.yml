name: agent-skills-ci

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/agent/**'
      - 'docs/sda/README.md'
      - '.github/workflows/agent-skills-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'docs/agent/**'
      - 'docs/sda/README.md'
      - '.github/workflows/agent-skills-ci.yml'

permissions:
  contents: read

jobs:
  validate-agent-skill-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate NLI agent skill pack
        run: python docs/agent/scripts/validate_skill_pack.py
