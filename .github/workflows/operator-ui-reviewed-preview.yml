name: operator-ui-reviewed-preview

on:
  pull_request:
    branches:
      - nli/wo-003-operator-interface-foundation
    paths:
      - .github/workflows/operator-ui-reviewed-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-ui-reviewed-preview
  cancel-in-progress: true

jobs:
  reviewed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout reviewed preview branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create isolated bearer-session review configuration
        shell: bash
        run: |
          set -euo pipefail
          TEMP_PASSWORD="EGVisual-${GITHUB_RUN_ID}-Review!"
          POSTGRES_PASSWORD="preview-db-${GITHUB_RUN_ID}"
          JWT_SECRET="$(openssl rand -hex 32)"
          SESSION_SECRET="$(openssl rand -hex 32)"
          S3_ACCESS_KEY="preview${GITHUB_RUN_ID}"
          S3_SECRET_KEY="$(openssl rand -hex 24)"

          echo "::add-mask::${TEMP_PASSWORD}"
          echo "::add-mask::${POSTGRES_PASSWORD}"
          echo "::add-mask::${JWT_SECRET}"
          echo "::add-mask::${SESSION_SECRET}"
          echo "::add-mask::${S3_SECRET_KEY}"

          {
            echo "TEMP_PASSWORD=${TEMP_PASSWORD}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
          } >> "${GITHUB_ENV}"

          cat > .env <<EOF
          APP_ENV=development
          NEXT_PUBLIC_DEPLOYMENT_LABEL=VISUAL REDESIGN REVIEW / NOT OFFICIAL PRODUCTION
          PROJECT_NAME=eg-addressing
          COMPOSE_PROJECT_NAME=eg_addressing_visual_preview_${GITHUB_RUN_ID}
          TZ=Africa/Malabo
          LOG_LEVEL=INFO

          ADMIN_PORT=3100
          API_PORT=8100
          POSTGRES_PORT=5434
          REDIS_PORT=6384
          MINIO_PORT=9100
          MINIO_CONSOLE_PORT=9101

          POSTGRES_DB=addressing
          POSTGRES_USER=addressing
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=postgresql+psycopg://addressing:${POSTGRES_PASSWORD}@postgres:5432/addressing
          REDIS_URL=redis://redis:6379/0

          S3_ENDPOINT=http://minio:9000
          S3_REGION=eu-west-1
          S3_BUCKET=addressing-visual-review
          S3_ACCESS_KEY=${S3_ACCESS_KEY}
          S3_SECRET_KEY=${S3_SECRET_KEY}

          JWT_SECRET=${JWT_SECRET}
          SESSION_SECRET=${SESSION_SECRET}
          SESSION_TTL_HOURS=6
          SESSION_COOKIE_MODE=bearer-local-storage
          SESSION_COOKIE_SECURE=false
          ALLOW_DEFAULT_DEMO_PASSWORDS=false
          PUBLICATION_RELEASE_ENABLED=false
          NEXT_PUBLIC_PUBLICATION_RELEASE_ENABLED=false

          ADMIN_BASE_URL=http://127.0.0.1:3100
          API_BASE_URL=http://127.0.0.1:8100/api
          NEXT_PUBLIC_API_BASE_URL=
          INTERNAL_API_BASE_URL=http://api:8100

          PUBLIC_RATE_LIMIT_ENABLED=true
          PUBLIC_RATE_LIMIT_MAX_REQUESTS=180
          PUBLIC_RATE_LIMIT_WINDOW_SECONDS=60
          EOF

      - name: Install migration dependencies
        run: python -m pip install --disable-pip-version-check -r services/api/requirements.txt

      - name: Start isolated infrastructure
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env -f infra/docker/docker-compose.yml up -d postgres redis minio
          for attempt in $(seq 1 60); do
            if docker compose --env-file .env -f infra/docker/docker-compose.yml exec -T postgres pg_isready -U addressing -d addressing >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env -f infra/docker/docker-compose.yml ps
          exit 1

      - name: Apply migrations and load temporary staff data
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="postgresql+psycopg://addressing:${POSTGRES_PASSWORD}@127.0.0.1:5434/addressing"
          python infra/scripts/migrate.py apply
          python infra/scripts/load_reference_data.py load
          APP_ENV=development \
          EG_ALLOW_DEV_FIXTURES=YES \
          DEVELOPMENT_FIXTURE_PASSWORD="${TEMP_PASSWORD}" \
          python infra/scripts/load_development_fixtures.py load

      - name: Build and start redesigned application stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env -f infra/docker/docker-compose.yml up -d --build api admin
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:8100/api/v1/health >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:3100/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env -f infra/docker/docker-compose.yml ps
          docker compose --env-file .env -f infra/docker/docker-compose.yml logs --tail=200 api admin
          exit 1

      - name: Verify local bearer login for every role
        shell: bash
        run: |
          set -euo pipefail
          for username in admin editor viewer agency_viewer; do
            python - "${username}" <<'PY' > /tmp/login-payload.json
          import json
          import os
          import sys
          print(json.dumps({'username': sys.argv[1], 'password': os.environ['TEMP_PASSWORD']}))
          PY
            curl --fail --silent --show-error \
              --header 'Content-Type: application/json' \
              --request POST \
              --data @/tmp/login-payload.json \
              http://127.0.0.1:3100/api/v1/auth/login > "/tmp/${username}-login.json"
            python - "${username}" <<'PY'
          import json
          import sys
          from pathlib import Path
          username = sys.argv[1]
          payload = json.loads(Path(f'/tmp/{username}-login.json').read_text())
          expected = 'agency_viewer' if username == 'agency_viewer' else username
          assert payload.get('user', {}).get('role') == expected, payload
          assert payload.get('token'), payload
          assert payload.get('auth_mode') == 'bearer_token', payload
          print(f'{username} bearer login verified')
          PY
          done

      - name: Start Pinggy and Cloudflare review tunnels
        id: tunnels
        shell: bash
        run: |
          set -euo pipefail

          nohup ssh \
            -p 443 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ExitOnForwardFailure=yes \
            -T \
            -R0:127.0.0.1:3100 \
            free.pinggy.io \
            > /tmp/pinggy.log 2>&1 &
          echo $! > /tmp/pinggy.pid

          curl --fail --location --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output /tmp/cloudflared
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:3100 \
            > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid

          PINGGY_URL=''
          CLOUDFLARE_URL=''
          for attempt in $(seq 1 120); do
            PINGGY_URL="$(grep -Eo 'https://[-a-zA-Z0-9.]+\.pinggy\.link' /tmp/pinggy.log | tail -1 || true)"
            CLOUDFLARE_URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | tail -1 || true)"
            pinggy_ok=1
            cloudflare_ok=1
            if [ -n "${PINGGY_URL}" ]; then
              curl --fail --silent --show-error "${PINGGY_URL}/login" >/dev/null 2>&1 && pinggy_ok=0 || true
            fi
            if [ -n "${CLOUDFLARE_URL}" ]; then
              curl --fail --silent --show-error "${CLOUDFLARE_URL}/login" >/dev/null 2>&1 && cloudflare_ok=0 || true
            fi
            if [ "${pinggy_ok}" -eq 0 ] && [ "${cloudflare_ok}" -eq 0 ]; then
              break
            fi
            sleep 2
          done

          if [ -z "${PINGGY_URL}" ] || [ -z "${CLOUDFLARE_URL}" ]; then
            echo 'Pinggy log:'
            cat /tmp/pinggy.log || true
            echo 'Cloudflare log:'
            cat /tmp/cloudflared.log || true
            exit 1
          fi

          echo "PRIMARY_URL=${PINGGY_URL}" >> "${GITHUB_ENV}"
          echo "BACKUP_URL=${CLOUDFLARE_URL}" >> "${GITHUB_ENV}"
          echo "primary_url=${PINGGY_URL}" >> "${GITHUB_OUTPUT}"
          echo "backup_url=${CLOUDFLARE_URL}" >> "${GITHUB_OUTPUT}"

      - name: Verify public login and protected session through both domains
        shell: bash
        run: |
          set -euo pipefail
          verify_public_login() {
            local base_url="$1"
            local label="$2"
            python - <<'PY' > /tmp/public-login-payload.json
          import json
          import os
          print(json.dumps({'username': 'admin', 'password': os.environ['TEMP_PASSWORD']}))
          PY
            curl --fail --silent --show-error \
              --header 'Content-Type: application/json' \
              --request POST \
              --data @/tmp/public-login-payload.json \
              "${base_url}/api/v1/auth/login" > "/tmp/${label}-public-login.json"
            TOKEN="$(python - "${label}" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(f'/tmp/{sys.argv[1]}-public-login.json').read_text())
          assert payload.get('user', {}).get('role') == 'admin', payload
          assert payload.get('auth_mode') == 'bearer_token', payload
          print(payload['token'])
          PY
          )"
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${TOKEN}" \
              "${base_url}/api/v1/auth/me" > "/tmp/${label}-public-me.json"
            python - "${label}" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(f'/tmp/{sys.argv[1]}-public-me.json').read_text())
          assert payload.get('user', {}).get('role') == 'admin', payload
          print(f'{sys.argv[1]} public login and protected session verified')
          PY
          }

          verify_public_login "${PRIMARY_URL}" primary
          verify_public_login "${BACKUP_URL}" backup

          mkdir -p artifacts/operator-visual-review
          cat > artifacts/operator-visual-review/access.txt <<EOF
          EG ADDRESSING OPERATOR VISUAL REDESIGN REVIEW
          Exact source head: ${GITHUB_SHA}
          Preview run: ${GITHUB_RUN_ID}
          Both public login paths were verified through their external HTTPS domains.
          Expected availability: approximately five hours after publication.

          PRIMARY LOGIN: ${PRIMARY_URL}/login
          BACKUP LOGIN: ${BACKUP_URL}/login
          PRIMARY HOME: ${PRIMARY_URL}/
          BACKUP HOME: ${BACKUP_URL}/

          Temporary accounts — all use the same password:
          admin
          editor
          viewer
          agency_viewer

          Password: ${TEMP_PASSWORD}

          Primary staff routes:
          ${PRIMARY_URL}/field
          ${PRIMARY_URL}/registry
          ${PRIMARY_URL}/verify
          ${PRIMARY_URL}/signage
          ${PRIMARY_URL}/reports
          ${PRIMARY_URL}/admin/staff

          Backup routes use the same paths on:
          ${BACKUP_URL}

          Review boundary: isolated development fixtures only. Publication is disabled. No production data is present.
          EOF

      - name: Upload externally verified access details
        uses: actions/upload-artifact@v4
        with:
          name: operator-ui-reviewed-access-${{ github.run_id }}
          path: artifacts/operator-visual-review/access.txt
          retention-days: 1
          if-no-files-found: error

      - name: Keep reviewed preview available
        shell: bash
        run: |
          set -euo pipefail
          for heartbeat in $(seq 1 60); do
            primary_status=0
            backup_status=0
            curl --fail --silent --show-error "${PRIMARY_URL}/login" >/dev/null || primary_status=$?
            curl --fail --silent --show-error "${BACKUP_URL}/login" >/dev/null || backup_status=$?
            if [ "${primary_status}" -ne 0 ] && [ "${backup_status}" -ne 0 ]; then
              echo "Both externally verified preview paths are unavailable at heartbeat ${heartbeat}." >&2
              exit 1
            fi
            echo "Reviewed preview heartbeat ${heartbeat}/60: primary=${primary_status}, backup=${backup_status}"
            sleep 300
          done

      - name: Capture diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/operator-visual-review
          docker compose --env-file .env -f infra/docker/docker-compose.yml ps \
            > artifacts/operator-visual-review/docker-compose-ps.txt 2>&1 || true
          docker compose --env-file .env -f infra/docker/docker-compose.yml logs --no-color --tail=300 api admin \
            > artifacts/operator-visual-review/application-logs.txt 2>&1 || true
          cp /tmp/pinggy.log artifacts/operator-visual-review/pinggy.log 2>/dev/null || true
          cp /tmp/cloudflared.log artifacts/operator-visual-review/cloudflared.log 2>/dev/null || true

      - name: Stop isolated review environment
        if: always()
        shell: bash
        run: |
          for pid_file in /tmp/pinggy.pid /tmp/cloudflared.pid; do
            if [ -f "${pid_file}" ]; then
              kill "$(cat "${pid_file}")" 2>/dev/null || true
            fi
          done
          docker compose --env-file .env -f infra/docker/docker-compose.yml down --remove-orphans || true
