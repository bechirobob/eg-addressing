services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: eg-addressing-postgres
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-addressing}
      POSTGRES_USER: ${POSTGRES_USER:-addressing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ../../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eg-addressing-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6384}:6379"
    volumes:
      - ../../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: eg-addressing-minio
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "${MINIO_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - ../../data/storage:/data

  api:
    build:
      context: ../../
      dockerfile: services/api/Dockerfile
    container_name: eg-addressing-api
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "${API_PORT:-8100}:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10

  admin:
    build:
      context: ../../
      dockerfile: apps/admin-portal/Dockerfile
    container_name: eg-addressing-admin
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      INTERNAL_API_BASE_URL: http://api:8100
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    ports:
      - "${ADMIN_PORT:-3100}:3100"
    depends_on:
      api:
        condition: service_healthy
